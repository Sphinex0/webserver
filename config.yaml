servers:
  - host: "127.0.0.1"
    ports: [8080]
    server_name: "proxy.local"  
    client_max_body_size: 1024
      
    routes: 
     - path: "/"
       root: "./www/html"
       autoindex: true
      #  default_file: "index.html"
      #  redirection: "http://google.com"


  - host: "127.0.0.2"
    ports: [3000]
    default_server: true
    server_name: "test"  
    routes: 
     - path: "/gg"
       root: "./www/html"
       default_file: "index.html"
